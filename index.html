<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather</h1>
        <div class="main">
            <input type="text" id="input" placeholder="City Name...">
            <button id="get-btn">Search</button>
        </div>
        <div class="hidden" id="result-section" >
            <h2 id="city-name"></h2>
            <p id="weather"></p>
            <p id="description"></p>
        </div>
        <p id="error" class="hidden" >City not found ! <br> Try again </p>
    </div>
    <script src="script.js"></script>
</body>
</html>
